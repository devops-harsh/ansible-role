---
# tasks file for httpd install

- name: Install apache httpd  # first task in play tp install apache on server 
  ansible.builtin.apt: # module
    name: apache2
    state: present # presetnt- install and absent= uninstall the package
    update_cache: yes 
  
- name: Copy file with owner and permissions # task 2 
  ansible.builtin.copy: # module 
    src: files/index.html
    dest: /var/www/html/
    owner: root
    group: root
    mode: '0644'
